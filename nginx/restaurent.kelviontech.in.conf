# ==============================================================================
# Nginx Configuration for restaurent.kelviontech.in
# Subdomain configuration for Restaurant QR Ordering Platform on Oracle Cloud VM
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (Redirects all HTTP traffic to HTTPS)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name restaurent.kelviontech.in;

    # Certbot ACME Challenge directory for SSL certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block (SSL & Reverse Proxy Rules)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name restaurent.kelviontech.in;

    # SSL Certificate Paths (Managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/restaurent.kelviontech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restaurent.kelviontech.in/privkey.pem;

    # SSL Optimization Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max Payload Upload Size (for menu item photos & images)
    client_max_body_size 25M;

    # --------------------------------------------------------------------------
    # Frontend Next.js Application Proxy (Port 3001)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # --------------------------------------------------------------------------
    # Backend FastAPI REST API Proxy (Port 8001)
    # --------------------------------------------------------------------------
    location /api/public/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Real-time WebSocket Protocol Upgrade Proxy (Port 8001 /ws)
    # Serves Kitchen Display System (KDS) & Guest Live Order Tracking
    # --------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://127.0.0.1:8001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSocket connection alive without timing out
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
