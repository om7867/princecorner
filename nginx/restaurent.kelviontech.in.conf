# ==============================================================================
# Nginx HTTPS Configuration for restaurant.kelviontech.in
# Subdomain configuration for Restaurant QR Ordering Platform on Oracle Cloud VM
# Runs alongside KelvionTech in the shared Nginx proxy container
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP Server Block (301 Redirect to HTTPS)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name restaurant.kelviontech.in;

    # Certbot ACME Challenge directory for SSL certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server Block (SSL & Reverse Proxy Rules)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name restaurant.kelviontech.in;

    # SSL Certificates issued by Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/restaurant.kelviontech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restaurant.kelviontech.in/privkey.pem;

    # SSL Security Optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25M;

    # Frontend Next.js Application Proxy (Host Port 3001)
    location / {
        proxy_pass http://172.17.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend FastAPI REST API Proxy (Host Port 8001)
    location /api/public/ {
        proxy_pass http://172.17.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Real-time WebSocket Protocol Upgrade Proxy (Host Port 8001 /ws/)
    # Serves Kitchen Display System (KDS) & Guest Live Order Tracking
    location /ws/ {
        proxy_pass http://172.17.0.1:8001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
