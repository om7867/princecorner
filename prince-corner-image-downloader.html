const allImages = [
  ...foodPhotos.map(p => ({...p, folder: "food-photos"})),
  ...menuPhotos.map(p => ({...p, folder: "menu-photos"})),
];

// Show previews on load
window.onload = function() {
  document.getElementById('previewLabel').style.display = 'block';
  const grid = document.getElementById('previewGrid');
  allImages.forEach(img => {
    const el = document.createElement('img');
    el.src = img.url;
    el.alt = img.name;
    el.loading = "lazy";
    grid.appendChild(el);
  });
};

async function downloadAll() {
  const btn = document.getElementById('downloadBtn');
  const progress = document.getElementById('progress');
  const barWrap = document.getElementById('barWrap');
  const bar = document.getElementById('bar');
  
  btn.disabled = true;
  btn.textContent = "⏳ Downloading...";
  barWrap.style.display = 'block';
  
  const zip = new JSZip();
  const foodFolder = zip.folder("food-photos");
  const menuFolder = zip.folder("menu-photos");
  
  let done = 0;
  const total = allImages.length;
  
  const downloadImage = async (img) => {
    try {
      const response = await fetch(img.url);
      const blob = await response.blob();
      const folder = img.folder === "food-photos" ? foodFolder : menuFolder;
      folder.file(img.name, blob);
      done++;
      bar.style.width = ((done / total) * 100) + '%';
      progress.textContent = `Downloaded ${done}/${total}: ${img.name}`;
    } catch (e) {
      done++;
      progress.textContent = `⚠️ Failed: ${img.name} — continuing...`;
    }
  };
  
  // Download in batches of 5
  for (let i = 0; i < allImages.length; i += 5) {
    const batch = allImages.slice(i, i + 5);
    await Promise.all(batch.map(downloadImage));
  }
  
  progress.textContent = "📦 Creating ZIP file...";
  
  const content = await zip.generateAsync({type: "blob"}, (metadata) => {
    bar.style.width = metadata.percent.toFixed(0) + '%';
  });
  
  saveAs(content, "prince-corner-images.zip");
  
  progress.textContent = "✅ Done! prince-corner-images.zip saved to your Downloads folder.";
  btn.textContent = "✅ Download Complete!";
  btn.disabled = false;
  btn.onclick = () => saveAs(content, "prince-corner-images.zip");
  btn.textContent = "⬇️ Download Again";
}
