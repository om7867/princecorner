version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database Service (Port 5433 on Host to avoid conflict)
  # ---------------------------------------------------------------------------
  restaurant-db:
    image: postgres:16-alpine
    container_name: restaurant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_db}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurant_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restaurant_user} -d ${POSTGRES_DB:-restaurant_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. FastAPI Backend Service (Port 8001 on Host to avoid conflict)
  # ---------------------------------------------------------------------------
  restaurant-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurant-backend
    restart: unless-stopped
    depends_on:
      restaurant-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-restaurant_user}:${POSTGRES_PASSWORD:-restaurant_secure_pass_2026}@restaurant-db:5432/${POSTGRES_DB:-restaurant_db}
      JWT_SECRET: ${JWT_SECRET:-change-this-production-jwt-secret-key-2026}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 480
      CORS_ORIGINS: ${CORS_ORIGINS:-https://restaurent.kelviontech.in,http://localhost:3001,http://localhost:3000}
      ENV: production
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-owner@kelviontech.in}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-ChangeMe123!}
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 3. Next.js Frontend Service (Port 3001 on Host to avoid conflict)
  # ---------------------------------------------------------------------------
  restaurant-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: restaurant-frontend
    restart: unless-stopped
    depends_on:
      - restaurant-backend
    environment:
      NODE_ENV: production
      API_BASE_URL: http://restaurant-backend:8000
      AUTH_JWT_SECRET: ${JWT_SECRET:-change-this-production-jwt-secret-key-2026}
      NEXT_PUBLIC_API_BASE_URL: /api/public
      NEXT_PUBLIC_WS_BASE_URL: wss://restaurent.kelviontech.in
      NEXT_PUBLIC_SITE_URL: https://restaurent.kelviontech.in
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  postgres_data:
